name: IPQ807X-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ807X.config
      firmware_tag: IPQ807X
      kernel_file: kernel-6.12
      artifact_prefix: IPQ807X
      manifest_file: libwrt-qualcommax-ipq807x.manifest
      release_summary: >-
        这是基于 25.12-nss 分支、适用于小米 AX3600（原版与 stock 布局）的 6.12 内核 NSS 固件，默认主题为 Aurora；内置软件包包括 cpufreq、ddns、upnp、wol、samba4、vlmcsd、autoreboot、uhttpd、frps、frpc、diskman、hd-idle、acme、wireguard、watchcat 和 3cat。PassWall2、Xray 与 Sing-Box 作为可选安装包收录在 Packages.tar.gz 中，刷机后可手动安装；详见 IPQ807X.config 和 General.config。
